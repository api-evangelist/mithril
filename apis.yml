aid: mithril
name: Mithril
description: >-
  Mithril is an AI omnicloud compute platform, operated by Foundry Technologies,
  that aggregates GPU, CPU, and storage capacity across multiple cloud providers
  behind a single interface with transparent, market-based pricing. Developers
  reserve NVIDIA A100/H100/H200 GPUs on flexible reservations or burst onto
  interruptible spot capacity via price-limited bids, attach WEKA/NVMe persistent
  storage, run Kubernetes clusters, and drive it all through the v2 Compute REST
  API, the `ml` CLI, and a Python batch/inference SDK. Used for training,
  fine-tuning, inference, and batch workloads; SOC 2 Type II certified. Backed by
  Lightspeed, Multicoin Capital, and Redpoint.
